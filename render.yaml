services:
  - type: web
    name: accessbridge-ai
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: PORT
        value: 5001
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
